name: Publish Voxel Frontier
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract tested portable build
        run: python -m zipfile -e "Voxel Frontier.zip" extracted
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: extracted/Voxel Frontier
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
